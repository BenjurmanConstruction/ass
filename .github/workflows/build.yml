name: Build app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check market data sources (information only)
        continue-on-error: true
        run: |
          UA="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Mobile Safari/537.36"
          echo "--- Yahoo ---"
          curl -sS -m 20 -A "$UA" -w "\nHTTP %{http_code}\n" "https://query1.finance.yahoo.com/v8/finance/chart/%5EGSPC?range=1d&interval=5m" | head -c 900 || true
          echo
          echo "--- FRED ---"
          curl -sS -m 20 -A "$UA" -w "\nHTTP %{http_code}\n" "https://fred.stlouisfed.org/graph/fredgraph.csv?id=SP500&cosd=2026-10-25" | head -c 500 || true

      - name: Build APK
        run: gradle --no-daemon assembleRelease

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk EasyWake.apk
          cp EasyWake.apk "EasyWake-v${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: EasyWake
          path: EasyWake.apk

      - name: Publish download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" EasyWake.apk "EasyWake-v${{ github.run_number }}.apk" \
            --title "Easy Wake build ${{ github.run_number }}" \
            --notes "Download EasyWake.apk below and open it on your Android phone to install."
