name: Build Sable installers

on:
  push:
    branches: [sable-daw]
  workflow_dispatch:

permissions:
  contents: write   # needed to attach the installers to the "sable-latest" release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Sable-Windows
          - os: macos-latest
            name: Sable-macOS
          - os: ubuntu-latest
            name: Sable-Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
          if-no-files-found: error
      # One permanent download link per platform. Marked as a pre-release so it never
      # replaces the phone app's builds as the repository's "Latest" release.
      - name: Attach installer to the sable-latest release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view sable-latest >/dev/null 2>&1 || gh release create sable-latest --prerelease --target sable-daw \
            --title "Sable DAW (latest build)" --notes "Automatic build of the Sable desktop DAW from the sable-daw branch. Windows: download Sable-Setup.exe." || true
          shopt -s nullglob
          files=(dist/*.exe dist/*.dmg dist/*.AppImage)
          gh release upload sable-latest "${files[@]}" --clobber
