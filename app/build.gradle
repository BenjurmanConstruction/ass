plugins {
    id 'com.android.application'
}

android {
    namespace 'app.easywake'
    compileSdk 34

    defaultConfig {
        applicationId 'app.easywake'
        minSdk 26
        targetSdk 34
        // Each GitHub build gets a higher number so new versions install over old ones.
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int)
        versionName '1.' + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
    }

    signingConfigs {
        shared {
            storeFile file('../signing/easywake.jks')
            storePassword 'easywake'
            keyAlias 'easywake'
            keyPassword 'easywake'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
        debug {
            signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
